<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบโทรมาตร เขื่อนขุนด่านปราการชล</title>
    
    <link rel="icon" type="image/png" href="L08-65.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.1/leaflet-omnivore.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
    <script>
        // สคริปต์ควบคุมการเด้งเฉพาะครั้งแรก
        document.addEventListener("DOMContentLoaded", () => {
            // เช็กในเครื่องว่าเคยเข้าเว็บนี้แล้วกดปิดไปหรือยัง
            if (!localStorage.getItem("hasVisitedKhundan")) {
                document.getElementById("welcomeDownloadModal").style.display = "flex";
            }
        });

        function closeWelcomeModal() {
            // ประทับตราฝังไว้ในเบราว์เซอร์ว่า "คนนี้เข้ามาแล้ว"
            localStorage.setItem("hasVisitedKhundan", "true");
            // ซ่อนหน้าต่าง
            document.getElementById("welcomeDownloadModal").style.display = "none";
        }
    </script>
    <!-- 🔴 จบส่วน Popup -->

    <!-- เปลี่ยนจาก sidebar เป็น bottom-panel พร้อมฟังชันก์คลิกเปิด/ปิด -->
    <div id="bottom-panel" class="bottom-panel">
        <div class="header" onclick="togglePanel()">
            <img src="Khundan.png" alt="ระบบโทรมาตร" class="header-logo">
            <span id="toggle-icon">▼</span>
        </div>
        
        <div class="control-panel">
            <div class="form-group">
                <label for="stationSelect">เลือกสถานี:</label>
                <select id="stationSelect" class="form-control">
                </select>
            </div>

            <div id="statusDisplay" class="status-box">
                สถานะ: รอข้อมูล
            </div>
            <a href="admin.php" class="admin-btn" target="_blank">⚙️ ตั้งค่าระบบ (Admin)</a>
        </div>
       
    </div>

    <div id="map"></div>
      
    <div id="imageModal" style="display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center;">
        <span onclick="document.getElementById('imageModal').style.display='none'" style="position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.3s;">&times;</span>
        <img id="modalImg" style="margin: auto; display: block; width: 80%; max-width: 800px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    </div>
  
    <script src="tele.js"></script>

    <!-- สคริปต์สไลด์เปิด/ปิด Bottom Panel -->
    <script>
        function togglePanel() {
            const panel = document.getElementById('bottom-panel');
            const icon = document.getElementById('toggle-icon');
            panel.classList.toggle('open');
            icon.innerText = panel.classList.contains('open') ? '▲' : '▼';
        }
    </script>
    
</body>
</html>
